name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/OrdenaPC.Tests/OrdenaPC.Tests.csproj -c Release

      - name: Publicar exe
        run: >
          dotnet publish src/OrdenaPC/OrdenaPC.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verificar que sea un solo archivo
        shell: pwsh
        run: |
          Get-ChildItem publish | Format-Table Name, Length
          $files = @(Get-ChildItem publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'OrdenaPC.exe') { throw "Se esperaba solo OrdenaPC.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: OrdenaPC
          path: publish/OrdenaPC.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/OrdenaPC.exe
