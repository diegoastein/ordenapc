name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests (.NET 8 y .NET Framework 4.8)
        run: dotnet test tests/OrdenaPC.Tests/OrdenaPC.Tests.csproj -c Release

      - name: Compilar exe
        run: dotnet build src/OrdenaPC/OrdenaPC.csproj -c Release -o build

      - name: Preparar descarga
        shell: pwsh
        run: |
          Get-ChildItem build | Format-Table Name, Length
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/OrdenaPC.exe dist/
          Compress-Archive dist/OrdenaPC.exe dist/OrdenaPC.zip
          Get-ChildItem dist | Format-Table Name, Length
          if ((Get-Item dist/OrdenaPC.exe).Length -gt 2MB) { throw "El exe pesa más de lo esperado" }

      - uses: actions/upload-artifact@v4
        with:
          name: OrdenaPC
          path: dist/OrdenaPC.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OrdenaPC.exe
            dist/OrdenaPC.zip
